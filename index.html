<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Principal Product Manager | AI-Native Commerce, Fintech &amp; Compliance</title>
  <style>
    :root {
      --bg: #020617;
      --surface: #0f172a;
      --surface-alt: rgba(15, 23, 42, 0.65);
      --border: #1e293b;
      --border-hover: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-body: #cbd5e1;
      --accent: #10b981;
      --accent-light: #34d399;
      --accent-bg: rgba(16, 185, 129, 0.12);
      --accent-border: rgba(16, 185, 129, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    .container { max-width: 1040px; margin: 0 auto; padding: 0 24px; }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(2, 6, 23, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }
    .brand {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent-light);
    }
    .nav-links { display: flex; gap: 28px; font-size: 14px; color: var(--text-body); }
    .nav-links a:hover { color: #fff; }
    .btn-sm {
      background: var(--accent);
      color: #020617;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .btn-sm:hover { background: var(--accent-light); }

    /* Hero */
    .hero { padding: 72px 0 48px; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent-bg);
      border: 1px solid var(--accent-border);
      color: #6ee7b7;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-light); }
    h1 {
      margin-top: 24px;
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.02em;
      max-width: 860px;
    }
    .highlight { color: var(--accent-light); }
    .hero-sub {
      margin-top: 22px;
      font-size: 17px;
      color: var(--text-body);
      max-width: 760px;
      line-height: 1.7;
    }
    .hero-sub strong { color: #fff; }
    .cta-row { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 14px; }
    .btn-primary {
      background: #fff;
      color: #020617;
      font-size: 14px;
      font-weight: 700;
      padding: 13px 22px;
      border-radius: 10px;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: #e2e8f0; }
    .btn-secondary {
      background: var(--surface);
      border: 1px solid var(--border-hover);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      padding: 13px 22px;
      border-radius: 10px;
      transition: border-color 0.2s;
    }
    .btn-secondary:hover { border-color: #64748b; }

    /* Metrics Strip */
    .metrics {
      margin-top: 52px;
      padding: 28px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
    }
    .metric-val { font-size: 28px; font-weight: 800; color: #fff; letter-spacing: -0.02em; }
    .metric-val.accent { color: var(--accent-light); }
    .metric-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    /* Sections */
    section, footer { padding: 52px 0; scroll-margin-top: 76px; }
    h2 { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
    .section-sub { font-size: 14px; color: var(--text-muted); margin-top: 6px; }

    /* Grids & Cards */
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; margin-top: 28px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 24px; }
    .card {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 26px;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: var(--border-hover); }
    .card.span-2 { grid-column: span 2; }
    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }
    .tag {
      background: var(--accent-bg);
      color: var(--accent-light);
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .meta { font-size: 12px; color: var(--text-muted); font-weight: 500; }
    .card h3 { font-size: 19px; font-weight: 700; color: #fff; line-height: 1.35; }
    .card p { font-size: 14px; color: var(--text-body); margin-top: 12px; line-height: 1.65; }
    .card p strong { color: #fff; }

    /* Experience Rows */
    .exp-stack { display: flex; flex-direction: column; gap: 16px; margin-top: 26px; }
    .exp-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px 26px;
    }
    .exp-title { font-size: 17px; font-weight: 700; color: #fff; }
    .exp-role { color: var(--accent-light); font-weight: 600; }
    .exp-desc { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
    .exp-date { font-size: 12px; color: var(--text-muted); font-weight: 600; }

    .edu-card {
      background: rgba(16, 185, 129, 0.05);
      border: 1px solid var(--accent-border);
      border-radius: 14px;
      padding: 22px;
    }
    .edu-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent-light); }
    .edu-school { font-size: 16px; font-weight: 700; color: #fff; margin-top: 6px; }

    /* Demo Video Slots */
    .demo-card {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }
    .demo-placeholder {
      aspect-ratio: 16 / 9;
      background: #0b1120;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .demo-placeholder p { font-size: 12px; color: var(--text-muted); margin-top: 10px; max-width: 320px; }
    .demo-body { padding: 20px 24px; }
    .demo-body h3 { font-size: 16px; font-weight: 700; }
    .demo-body p { font-size: 13px; color: var(--text-muted); margin-top: 6px; }

    /* Articles */
    .article-card {
      display: block;
      background: rgba(15, 23, 42, 0.45);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      transition: border-color 0.2s;
    }
    .article-card:hover { border-color: var(--accent-border); }
    .article-tag { font-size: 12px; font-weight: 600; color: var(--accent-light); }
    .article-card h3 { font-size: 16px; font-weight: 700; color: #fff; margin-top: 6px; }
    .article-card p { font-size: 13px; color: var(--text-muted); margin-top: 6px; }

    /* Skills */
    .skill-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent-light); }
    .skill-list { font-size: 14px; color: var(--text-body); margin-top: 12px; line-height: 1.7; }

    /* Footer */
    footer {
      margin-top: 40px;
      border-top: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.45);
      padding: 60px 24px;
      text-align: center;
    }
    footer p { max-width: 580px; margin: 14px auto 0; font-size: 14px; color: var(--text-muted); }
    .footer-btns { margin-top: 28px; display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; }
    .btn-accent {
      background: var(--accent);
      color: #020617;
      font-size: 14px;
      font-weight: 700;
      padding: 12px 22px;
      border-radius: 10px;
    }
    .btn-accent:hover { background: var(--accent-light); }
    .copyright { margin-top: 40px; font-size: 12px; color: #475569; }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .metrics { grid-template-columns: repeat(2, 1fr); }
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .card.span-2 { grid-column: span 1; }
    }
  </style>
</head>
<body>

  <header>
    <div class="container nav-inner">
      <a href="#" class="brand">ProductMechanic</a>
      <nav class="nav-links">
        <a href="#wins">Selected Wins</a>
        <a href="#experience">Career Pedigree</a>
        <a href="#demos">Demos &amp; Articles</a>
        <a href="#skills">Expertise</a>
      </nav>
      <a href="#contact" class="btn-sm">Get in Touch</a>
    </div>
  </header>

  <main class="container">
    <!-- Hero -->
    <div class="hero">
      <div class="badge">
        <span class="dot"></span>
        Principal / Group Product Leader • 19+ Years • Open to GCC / Dubai Leadership (30-Day Notice)
      </div>

      <h1>
        Building &amp; scaling <span class="highlight">AI-native commerce, fintech &amp; compliance</span> platforms at global scale.
      </h1>

      <p class="hero-sub">
